id: fixed_pool_burst
description: "Fixed pool burst workload"
workload:
  msgs_per_sec: 200
  msg_size_bytes: 128
  duration_sec: 4
  pattern: burst
  burst:
    factor: 4
    duration_ms: 200
    interval_ms: 1000
execution:
  mode: fixed_pool
  workers: 4
  queue_capacity: 2000
algorithm:
  adapter: kyber
  operation: kem_aead_encrypt
metrics:
  prometheus_endpoint: "0.0.0.0:9898"
  jsonl_out: "./results/fixed_pool_burst.jsonl"
