# Placeholder schema describing experiment configuration structure
schema: "experiment"
version: 0

fields:
  comparison_mode:
    type: "string"
    enum: ["pqc_vs_classical", "pqc_only", "classical_only"]

  network_emulation:
    type: "object"
    properties:
      latency_ms: { type: "integer" }
      jitter_ms: { type: "integer" }
      bandwidth_mbps: { type: "number" }
      packet_loss_percent: { type: "number" }

  workload:
    type: "object"
    properties:
      type:
        type: "string"
        enum: ["sign", "verify", "kem_encapsulate", "kem_decapsulate", "bulk_encrypt", "bulk_decrypt"]
      concurrency: { type: "integer" }
      repetitions: { type: "integer", default: 30 }
      warmup_seconds: { type: "integer", default: 10 }
      chunk_size_bytes: { type: "integer" }

  algorithms:
    type: "object"
    properties:
      pqc:
        type: "array"
        items: { type: "string" }
        default: ["Kyber512", "Kyber768", "Dilithium2", "Dilithium3"]
      classical:
        type: "object"
        properties:
          key_exchange:
            type: "array"
            items: { type: "string" }
            default: ["ECDHE-P256"]
          signature:
            type: "array"
            items: { type: "string" }
            default: ["RSA-2048", "ECDSA-P256"]
      symmetric:
        type: "array"
        items: { type: "string" }
        default: ["AES-GCM-256"]

  storage_backend:
    type: "object"
    properties:
      type:
        type: "string"
        enum: ["filesystem", "gcs", "s3", "memory"]
      config:
        type: "object"
        additionalProperties: true

  environment:
    type: "object"
    properties:
      gcp:
        type: "object"
        properties:
          region: { type: "string", default: "us-central1" }
          vm_type: { type: "string", default: "n1-standard-8" }

