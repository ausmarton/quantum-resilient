[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
description = "Distributed experiment orchestrator for PQC benchmark framework"
authors = ["Quantum Resilient Team"]

[[bin]]
name = "qr-orchestrator"
path = "src/main.rs"

[features]
default = []
storage-s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
storage-gcs = ["dep:cloud-storage"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "fs", "io-util"] }
futures = "0.3"

# HTTP server (using axum for cleaner API design)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Kubernetes client
kube = { version = "0.95", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
k8s-openapi = { version = "0.23", default-features = false, features = ["v1_31"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP client for worker communication
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"

# Cron scheduling
cron = "0.12"

# Metrics
prometheus = "0.13"

# Object storage (optional)
aws-sdk-s3 = { version = "1.35", optional = true }
aws-config = { version = "1.5", optional = true }
cloud-storage = { version = "0.11", optional = true }
tokio-util = { version = "0.7", features = ["io"] }

# Compression for artifact handling
flate2 = "1.0"

