[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python_orchestrator"
version = "0.0.0"
description = "Placeholder Python orchestrator for PQC benchmarking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
authors = [{ name = "Contributors" }]
dependencies = [
	"PyYAML==6.0.1",
	"pandas==2.2.2",
	"numpy==1.26.4",
	"scipy==1.11.4",
	"matplotlib==3.8.4",
	"seaborn==0.13.2",
	"nbformat==5.10.4"
]

[project.scripts]
pqc-orchestrator = "python_orchestrator.cli:main"


