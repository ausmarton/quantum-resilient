[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python_orchestrator"
version = "0.0.0"
description = "Placeholder Python orchestrator for PQC benchmarking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
authors = [{ name = "Contributors" }]
dependencies = [
	"PyYAML>=6.0.1",
	"pandas>=2.2.0",
	"numpy>=1.26.0",
	"scipy>=1.11.0",
	"matplotlib>=3.8.0",
	"seaborn>=0.13.0",
	"nbformat>=5.10.0",
	"tabulate>=0.9.0"
]

[project.scripts]
pqc-orchestrator = "python_orchestrator.cli:main"


