[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python_orchestrator"
version = "0.0.0"
description = "Placeholder Python orchestrator for PQC benchmarking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT License" }
authors = [{ name = "Contributors" }]
dependencies = ["PyYAML>=6.0", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "seaborn>=0.12", "nbformat>=5.9"]

[project.scripts]
pqc-orchestrator = "python_orchestrator.cli:main"


