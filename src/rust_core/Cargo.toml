[package]
name = "rust_core"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Placeholder Rust core for PQC benchmarking"
repository = ""

[lib]
name = "rust_core"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
tiny_http = "0.12"
rand_chacha = "0.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
aes-gcm = "0.10"
aead = "0.5"


