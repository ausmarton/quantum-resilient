{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quantum-resilient.fullname" . }}
  labels:
    {{- include "quantum-resilient.labels" . | nindent 4 }}
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quantum-resilient.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quantum-resilient.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

