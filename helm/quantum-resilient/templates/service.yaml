apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantum-resilient.fullname" . }}
  labels:
    {{- include "quantum-resilient.labels" . | nindent 4 }}
    component: network
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quantum-resilient.selectorLabels" . | nindent 4 }}
  ports:
    - name: control
      port: {{ .Values.service.controlPort }}
      targetPort: {{ .Values.service.controlPort }}
      protocol: TCP
    - name: prom
      port: {{ .Values.service.promPort }}
      targetPort: {{ .Values.service.promPort }}
      protocol: TCP

