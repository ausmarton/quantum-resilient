{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quantum-resilient-orchestrator.fullname" . }}
  labels:
    {{- include "quantum-resilient-orchestrator.labels" . | nindent 4 }}
rules:
  # Jobs management for experiment workers
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Pod management and monitoring
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Pod logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod exec for result collection
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # ConfigMap management for scenario distribution
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Services for worker discovery
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quantum-resilient-orchestrator.fullname" . }}
  labels:
    {{- include "quantum-resilient-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quantum-resilient-orchestrator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quantum-resilient-orchestrator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

