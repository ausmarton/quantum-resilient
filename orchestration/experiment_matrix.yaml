# =============================================================================
# experiment_matrix.yaml - Declarative experiment configuration
#
# Defines all scenarios for the dissertation benchmarking study:
# - Algorithms: RSA, ECDSA, Kyber, Dilithium, Hybrid
# - Payload sizes: 256B, 1KB, 4KB, 16KB
# - Workload rates: 100, 500, 2000, 10000 msg/s
# - Workload patterns: Constant (baseline), Burst (enterprise patterns)
# - Duration: 30s (baseline), 300s (5-min sustained load)
# - Repeats: 5 runs per configuration for statistical rigor
# =============================================================================

# Global defaults
defaults:
  duration_sec: 30
  runs: 5
  rng_seed_base: 42
  execution:
    mode: fixed_pool
    workers: 4
    queue_capacity: 4000

# Scaling experiment configuration
scaling:
  # Replica counts to test for horizontal scaling
  replicas: [1, 2, 4, 8]
  
  # Which algorithms to include in scaling tests
  # (subset to reduce experiment time)
  scaling_algorithms:
    - kyber512
    - dilithium2
    - hybrid_kyber_dilithium
  
  # Fixed parameters for scaling tests
  scaling_payload: 1024
  scaling_rate: 500
  scaling_runs: 3

# Environment configurations
environments:
  native:
    enabled: true
    script: run_local.sh
    output_base: results/native
  
  minikube:
    enabled: true
    script: run_minikube.sh
    output_base: results/minikube
  
  gcp:
    enabled: true
    script: deploy_gcp.sh
    output_base: results/gcp
    requires:
      - project
      - bucket
      - region

# Experiment definitions
experiments:
  # ─────────────────────────────────────────────────────────────────────────
  # Classical Cryptography Baselines
  # ─────────────────────────────────────────────────────────────────────────
  
  - algorithm: rsa2048
    description: "RSA-2048 signature baseline"
    adapter: rsa2048
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [100, 500, 2000]
    runs: 5
    category: classical
    
  - algorithm: ecdsa_p256
    description: "ECDSA P-256 signature baseline"
    adapter: ecdsa_p256
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [100, 500, 2000]
    runs: 5
    category: classical

  # ─────────────────────────────────────────────────────────────────────────
  # Post-Quantum Cryptography
  # ─────────────────────────────────────────────────────────────────────────
  
  - algorithm: kyber512
    description: "Kyber-512 KEM + AES-GCM encryption"
    adapter: kyber
    operation: kem_aead_encrypt
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [100, 500, 2000]
    runs: 5
    category: pqc
    kem:
      paramset: kyber512
      
  - algorithm: dilithium2
    description: "Dilithium-2 digital signature"
    adapter: dilithium
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [100, 500, 2000]
    runs: 5
    category: pqc
    sig:
      paramset: dilithium2

  # ─────────────────────────────────────────────────────────────────────────
  # Hybrid Post-Quantum + Classical
  # ─────────────────────────────────────────────────────────────────────────
  
  - algorithm: hybrid_kyber_dilithium
    description: "Hybrid: Kyber-512 KEM → AES-GCM → Dilithium-2 sign"
    adapter: hybrid_kyber_dilithium
    operation: kem_aead_sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [100, 500, 2000]
    runs: 5
    category: hybrid
    kem:
      paramset: kyber512
    sig:
      paramset: dilithium2

  # ─────────────────────────────────────────────────────────────────────────
  # Enterprise Representativeness: Quick Wins
  # ─────────────────────────────────────────────────────────────────────────
  
  # Burst Pattern Experiments (simulates market open, end of day spikes)
  - algorithm: rsa2048
    description: "RSA-2048 with burst pattern (enterprise workload)"
    adapter: rsa2048
    operation: sign
    payload_sizes: [1024, 4096]  # Most relevant payloads
    rates: [2000]  # High rate for burst testing
    runs: 5
    category: classical
    workload_pattern: burst
    burst_config:
      factor: 5  # 5× multiplier during bursts
      duration_ms: 5000  # 5 second bursts
      interval_ms: 30000  # Every 30 seconds
    
  - algorithm: ecdsa_p256
    description: "ECDSA P-256 with burst pattern (enterprise workload)"
    adapter: ecdsa_p256
    operation: sign
    payload_sizes: [1024, 4096]
    rates: [2000]
    runs: 5
    category: classical
    workload_pattern: burst
    burst_config:
      factor: 5
      duration_ms: 5000
      interval_ms: 30000
      
  - algorithm: kyber512
    description: "Kyber-512 with burst pattern (enterprise workload)"
    adapter: kyber
    operation: kem_aead_encrypt
    payload_sizes: [1024, 4096]
    rates: [2000]
    runs: 5
    category: pqc
    workload_pattern: burst
    burst_config:
      factor: 5
      duration_ms: 5000
      interval_ms: 30000
    kem:
      paramset: kyber512
      
  - algorithm: dilithium2
    description: "Dilithium-2 with burst pattern (enterprise workload)"
    adapter: dilithium
    operation: sign
    payload_sizes: [1024, 4096]
    rates: [2000]
    runs: 5
    category: pqc
    workload_pattern: burst
    burst_config:
      factor: 5
      duration_ms: 5000
      interval_ms: 30000
    sig:
      paramset: dilithium2
      
  - algorithm: hybrid_kyber_dilithium
    description: "Hybrid with burst pattern (enterprise workload)"
    adapter: hybrid_kyber_dilithium
    operation: kem_aead_sign
    payload_sizes: [1024, 4096]
    rates: [2000]
    runs: 5
    category: hybrid
    workload_pattern: burst
    burst_config:
      factor: 5
      duration_ms: 5000
      interval_ms: 30000
    kem:
      paramset: kyber512
    sig:
      paramset: dilithium2

  # 10K msg/s Rate Experiments (closer to small bank scale)
  - algorithm: rsa2048
    description: "RSA-2048 at 10K msg/s (enterprise-scale rate)"
    adapter: rsa2048
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [10000]
    runs: 5
    category: classical
    
  - algorithm: ecdsa_p256
    description: "ECDSA P-256 at 10K msg/s (enterprise-scale rate)"
    adapter: ecdsa_p256
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [10000]
    runs: 5
    category: classical
    
  - algorithm: kyber512
    description: "Kyber-512 at 10K msg/s (enterprise-scale rate)"
    adapter: kyber
    operation: kem_aead_encrypt
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [10000]
    runs: 5
    category: pqc
    kem:
      paramset: kyber512
      
  - algorithm: dilithium2
    description: "Dilithium-2 at 10K msg/s (enterprise-scale rate)"
    adapter: dilithium
    operation: sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [10000]
    runs: 5
    category: pqc
    sig:
      paramset: dilithium2
      
  - algorithm: hybrid_kyber_dilithium
    description: "Hybrid at 10K msg/s (enterprise-scale rate)"
    adapter: hybrid_kyber_dilithium
    operation: kem_aead_sign
    payload_sizes: [256, 1024, 4096, 16384]
    rates: [10000]
    runs: 5
    category: hybrid
    kem:
      paramset: kyber512
    sig:
      paramset: dilithium2

  # 5-minute Duration Experiments (sustained load behavior)
  - algorithm: kyber512
    description: "Kyber-512 sustained load (5-minute duration)"
    adapter: kyber
    operation: kem_aead_encrypt
    payload_sizes: [1024]
    rates: [2000]
    runs: 3  # Fewer runs for longer duration
    duration_sec: 300  # 5 minutes
    category: pqc
    kem:
      paramset: kyber512
      
  - algorithm: dilithium2
    description: "Dilithium-2 sustained load (5-minute duration)"
    adapter: dilithium
    operation: sign
    payload_sizes: [1024]
    rates: [2000]
    runs: 3
    duration_sec: 300
    category: pqc
    sig:
      paramset: dilithium2
      
  - algorithm: hybrid_kyber_dilithium
    description: "Hybrid sustained load (5-minute duration)"
    adapter: hybrid_kyber_dilithium
    operation: kem_aead_sign
    payload_sizes: [1024]
    rates: [2000]
    runs: 3
    duration_sec: 300
    category: hybrid
    kem:
      paramset: kyber512
    sig:
      paramset: dilithium2

# Comparison groups for analysis
comparisons:
  # PQC vs Classical signatures
  - name: "pqc_vs_classical_sign"
    baseline: ecdsa_p256
    treatment: dilithium2
    metric: latency_us
    
  # PQC vs Classical encryption/KEM
  - name: "pqc_vs_classical_encrypt"
    baseline: rsa2048
    treatment: kyber512
    metric: latency_us
    
  # Hybrid vs pure PQC
  - name: "hybrid_vs_pqc"
    baseline: kyber512
    treatment: hybrid_kyber_dilithium
    metric: latency_us

# Output configuration
output:
  generated_scenarios_dir: generated-scenarios
  final_results_dir: final-results
  figures_subdir: figures
  stats_subdir: stats
  tables_subdir: tables

