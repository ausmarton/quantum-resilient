[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
description = "Core library for PQC vs classical cryptography benchmarking in real-time streaming pipelines"
authors = ["Quantum Resilient Team"]

[lib]
name = "rust_core"
path = "src/lib.rs"

[[bin]]
name = "pqc-bench"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }

# Cryptography dependencies
rsa = "0.9"
pkcs8 = "0.10"
rand = "0.8"
sha2 = "0.10"

p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }

base64 = "0.22"
