name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (editable, pinned)
        working-directory: src/python_orchestrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -c constraints.txt
          python -m pip install -c constraints.txt pytest ruff flake8

      - name: Build Rust core
        working-directory: src/rust_core
        run: |
          cargo build --release
      - name: Rust tests
        working-directory: src/rust_core
        run: cargo test --all --quiet
      - name: Rust security audit
        working-directory: src/rust_core
        run: |
          cargo install cargo-audit --locked || true
          cargo audit -q || true

      - name: Rust format check
        working-directory: src/rust_core
        run: cargo fmt --all -- --check

      - name: Rust clippy (non-blocking)
        working-directory: src/rust_core
        continue-on-error: true
        run: cargo clippy --all-targets --all-features

      - name: Python lint (ruff - syntax/errors only)
        working-directory: src/python_orchestrator
        run: |
          ruff check --select E9,F63,F7,F82 --ignore E501 .
          flake8 --select=E9,F63,F7,F82 .
      - name: Python dependency check
        working-directory: src/python_orchestrator
        run: |
          python -m pip check || true

      - name: Python tests
        working-directory: src/python_orchestrator
        run: |
          pytest -q || true

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true
      - name: Emit metrics via Rust helper
        run: cargo run --quiet --release --manifest-path src/rust_core/Cargo.toml --bin emit_metrics

      - name: Short integration run (orchestrator)
        env:
          TZ: UTC
          LC_ALL: C
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          pqc-orchestrator --config ./configs/default.yaml || python -m python_orchestrator.cli --config ./configs/default.yaml

      - name: Reproducibility check (local)
        env:
          TZ: UTC
          LC_ALL: C
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          bash scripts/reproduce.sh --config ./configs/default.yaml --mode local

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-zip
          path: results/report.zip
          if-no-files-found: warn


