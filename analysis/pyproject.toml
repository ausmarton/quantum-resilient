[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-analysis"
version = "0.1.0"
description = "Analysis tools for Quantum-Resilient benchmark framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quantum Resilient Team"}
]
keywords = ["quantum", "cryptography", "benchmark", "analysis", "pqc"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "fastjsonschema>=2.18.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-bigquery>=3.11.0",
    "boto3>=1.28.0",
    "jupyterlab>=4.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "qr-analysis[ml,dev]",
]

[project.scripts]
qr-fetch = "scripts.fetch_results:main"
qr-merge = "scripts.merge_jsonl:main"
qr-stats = "scripts.compute_statistics:main"
qr-effects = "scripts.effect_sizes:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
