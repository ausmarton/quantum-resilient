apiVersion: v1
kind: Service
metadata:
  name: quantum-resilient
  labels:
    app: quantum-resilient
    component: network
spec:
  type: ClusterIP
  selector:
    app: quantum-resilient
  ports:
    - name: control
      port: 6060
      targetPort: 6060
      protocol: TCP
    - name: prom
      port: 9898
      targetPort: 9898
      protocol: TCP

