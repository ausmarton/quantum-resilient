---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-orchestrator
  labels:
    app: quantum-resilient
    component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantum-resilient
      component: orchestrator
  template:
    metadata:
      labels:
        app: quantum-resilient
        component: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: qr-orchestrator
      terminationGracePeriodSeconds: 30
      containers:
        - name: orchestrator
          image: localhost/qr-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 7070
              protocol: TCP
          env:
            - name: QR_ORCH_LISTEN_ADDR
              value: "0.0.0.0:7070"
            - name: QR_ORCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QR_WORKER_IMAGE
              value: "localhost/pqc-bench:latest"
            - name: QR_LOCAL_RESULTS_DIR
              value: "/data/results"
            - name: QR_MAX_TIME_DRIFT_NS
              value: "5000000"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: results-data
              mountPath: /data/results
      volumes:
        - name: results-data
          emptyDir:
            sizeLimit: 10Gi

