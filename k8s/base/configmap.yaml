apiVersion: v1
kind: ConfigMap
metadata:
  name: quantum-resilient-scenario
  labels:
    app: quantum-resilient
    component: config
data:
  active_scenario.yaml: |
    # Default cluster smoke test scenario
    # Replace this ConfigMap to run different scenarios
    id: cluster_smoke_test
    description: "Default Kubernetes cluster smoke test"
    workload:
      msgs_per_sec: 20
      msg_size_bytes: 128
      duration_sec: 5
      pattern: constant
    algorithm:
      adapter: noop
      operation: sign
    metrics:
      prometheus_endpoint: "0.0.0.0:9898"
      jsonl_out: "/app/results/results.jsonl"
    execution:
      mode: fixed_pool
      workers: 4
      queue_capacity: 2000

