apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quantum-resilient-hpa
  labels:
    app: quantum-resilient
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quantum-resilient
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Scale based on custom Prometheus metric: pqc_queue_length
    # Threshold: 75% of queue_capacity (2000) = 1500 average value triggers scale-out
    - type: Pods
      pods:
        metric:
          name: pqc_queue_length
        target:
          type: AverageValue
          averageValue: "1500"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

