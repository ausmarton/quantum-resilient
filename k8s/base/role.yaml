apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quantum-resilient
  labels:
    app: quantum-resilient
    component: rbac
rules:
  # Allow reading configmaps for scenario configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading secrets if needed for future TLS support
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

