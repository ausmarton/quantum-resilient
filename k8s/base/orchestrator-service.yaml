---
apiVersion: v1
kind: Service
metadata:
  name: qr-orchestrator
  labels:
    app: quantum-resilient
    component: orchestrator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "7070"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 7070
      targetPort: api
      protocol: TCP
  selector:
    app: quantum-resilient
    component: orchestrator

