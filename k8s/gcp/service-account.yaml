# =============================================================================
# service-account.yaml - Kubernetes ServiceAccount for Workload Identity
#
# Links to GCP service account created by Terraform.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pqc-bench-sa
  namespace: default
  labels:
    app: pqc-bench
    component: identity
    environment: gcp
  annotations:
    # This annotation is set by deploy_gcp.sh with the actual GCP SA email
    iam.gke.io/gcp-service-account: "PLACEHOLDER_GCP_SA_EMAIL"

