# =============================================================================
# worker-job.yaml - Kubernetes Job for pqc-bench execution
#
# Runs a deterministic benchmark workload and exits on completion.
# Results are written to a PVC for later retrieval.
#
# Apply: kubectl apply -f k8s/worker-job.yaml
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: pqc-bench-worker
  namespace: default
  labels:
    app: pqc-bench
    component: worker
    experiment: hybrid-kyber-dilithium
spec:
  # Job configuration
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
  
  template:
    metadata:
      labels:
        app: pqc-bench
        component: worker
      annotations:
        # Prometheus scraping annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
        prometheus.io/path: "/metrics"
    spec:
      restartPolicy: Never
      
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      
      # Init container to gather environment metadata
      initContainers:
        - name: gather-metadata
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              # Create metadata JSON
              cat > /results/container_metadata.json << EOF
              {
                "type": "kubernetes_container",
                "node_name": "${NODE_NAME:-unknown}",
                "pod_name": "${POD_NAME:-unknown}",
                "pod_namespace": "${POD_NAMESPACE:-default}",
                "pod_ip": "${POD_IP:-unknown}",
                "container_image": "pqc-bench:latest",
                "kernel_version": "$(uname -r)",
                "arch": "$(uname -m)",
                "hostname": "$(hostname)",
                "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
              EOF
              
              echo "Metadata written to /results/container_metadata.json"
              cat /results/container_metadata.json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: results
              mountPath: /results
      
      # Main container running pqc-bench
      containers:
        - name: pqc-bench
          image: pqc-bench:latest
          imagePullPolicy: IfNotPresent
          
          # Command to run the benchmark
          args:
            - "--scenario"
            - "/config/scenario.yaml"
          
          # Environment variables
          env:
            - name: RUST_LOG
              value: "info"
            - name: QR_MODE
              value: "container"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          # Volume mounts
          volumeMounts:
            - name: scenario-config
              mountPath: /config
              readOnly: true
            - name: results
              mountPath: /results
          
          # Resource requests and limits
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          
          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          
          # Ports
          ports:
            - name: metrics
              containerPort: 9898
              protocol: TCP
      
      # Volumes
      volumes:
        - name: scenario-config
          configMap:
            name: pqc-bench-scenario
        - name: results
          persistentVolumeClaim:
            claimName: pqc-bench-results
      
      # Tolerations for Minikube
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoSchedule"

